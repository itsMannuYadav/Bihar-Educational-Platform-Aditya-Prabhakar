# Reference only — Blueprint sync (rendering this file) requires a paid
# Render plan. On the free plan, create the service manually instead:
# New → Web Service → connect this repo → Language: Docker. This file still
# documents the exact shape (fields, env var list, health check, pre-deploy
# command) to enter by hand into that form.
services:
  - type: web
    name: shiksha-sathi-api
    env: docker
    # Render's docs disagree with each other on whether dockerfilePath/
    # dockerContext are relative to repo root or to rootDir once rootDir is
    # set (the Blueprint spec reference says repo root always; the monorepo
    # guide says relative to rootDir). Whichever is "correct", combining
    # rootDir with these two fields produced a real double-nested path on
    # an actual deploy (.../apps/api/apps: no such file or directory) — so
    # rootDir is dropped here and both paths are spelled out from repo root
    # instead, removing the ambiguity rather than guessing which doc is
    # right. Tradeoff: without rootDir, a push touching only apps/web also
    # triggers a rebuild of this service — cosmetic, not a correctness
    # issue; revisit with Render's Build Filters if that gets noisy.
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    region: singapore
    plan: starter
    healthCheckPath: /api/v1/health
    # Runs once per deploy, in a fresh instance of the built image, before
    # traffic cuts over to it — see the comment on Dockerfile's CMD for why
    # this is separate from the container's boot command.
    preDeployCommand: uv run --no-sync alembic upgrade head
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      # Only needed as a fallback for Supabase projects still on legacy
      # HS256 tokens — this project's JWKS-issued ES256 tokens don't use it.
      # Safe to leave blank.
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: LLM_MAX_CONCURRENCY
        sync: false
