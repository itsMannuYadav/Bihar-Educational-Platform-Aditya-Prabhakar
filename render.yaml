services:
  - type: web
    name: shiksha-sathi-api
    env: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    healthCheckPath: /api/v1/health
    # Runs once per deploy, in a fresh instance of the built image, before
    # traffic cuts over to it — see the comment on Dockerfile's CMD for why
    # this is separate from the container's boot command.
    preDeployCommand: uv run --no-sync alembic upgrade head
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: LLM_MAX_CONCURRENCY
        sync: false
